# Configuration for Problem 1: Mitochondrial Expression Module Indicators
# All tunable parameters are defined here.

# Paths (relative to project root)
paths:
  data_dir: "数据文件"
  features_dir: "数据文件/features"
  labels_dir: "数据文件/labels"
  metadata_dir: "数据文件/metadata"
  submission_dir: "数据文件/submission"
  output_dir: "outputs"

# Module definition (Stage 1)
modules:
  K: 14
  include_pathway_level: true  # Also output 149 pathway-level scores

# Evidence weights for EWM (Stage 3, Method A)
evidence_weights:
  enabled: true
  scores:
    targetp: true
    mito_domain: true
    coexpression_gnf_n50: true
    msms: true
    yeast_homolog: true
    rickettsia_homolog: true
    pgc_induction: false       # ~25% missing, excluded
  range: [0.8, 1.2]            # Weight mapping range

# Gene set refinement (Stage 2, optional)
gene_set_refinement:
  enabled: false               # Default off: prefer biological annotations
  sparsity_threshold: 0.1
  elasticnet_alpha: 0.5
  min_genes_after_refinement: 5

# Ensemble weights (Stage 3)
ensemble:
  gamma_ewm: 0.50
  gamma_res: 0.25
  gamma_spca: 0.25

# Orthogonalization (Stage 4)
orthogonalization:
  method: "none"               # "lowdin" | "partial" | "none" | "zca"
                                # Set to "none" because Löwdin Σ^{-1/2} destroys
                                # biologically meaningful module correlations and
                                # adds no new information for Problem 2 (R²=1.000
                                # from raw method columns).
  partial_corr_threshold: 0.7

# Cell death module enhancement (Ref: Glover et al. 2024)
cell_death:
  module_index: 12             # CELL_DEATH module index
  enhancement_alpha: 0.25      # Weight boost factor (1+α) in ensemble fusion
  nonlinear_knockout: false    # Use sigmoid threshold for knockout response
  nonlinear_beta: 5.0          # Sigmoid steepness
  nonlinear_threshold_percentile: 75  # Percentile for activation threshold

# Knockout simulation (Stage 5)
knockout:
  zero_mode: "mean"            # "mean" (z=0) | "min" (lowest observed)
  compute_res: true            # Recompute RES after knockout

# Derived indicators (pathway imbalance indices)
derived_indicators:
  enabled: true
  include_bcl2_balance: true
  include_assembly_stress: true
  include_mtdna_tcr: true      # Transcription-replication coupling

# Lineage-conditioned indicators
lineage_conditioned:
  enabled: true
  min_samples_per_lineage: 5

# ── Problem 2: Gene dependency prediction ─────────────────────────────
prediction:
  # Feature engineering
  features:
    pathway_pca_components: 20
    include_res_delta: true         # Δ_RES via prefix-sum trick (now fast)

  # All models are interpretable formula-based models (see formula: section below).
  # No tree ensembles, gradient boosting, neural networks, or matrix factorization.

  calibration:
    alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]
    clip_range: [-3.0, 5.0]

  # Baselines
  baselines:
    prior_weight: 10.0             # Empirical Bayes shrinkage strength
    svd_k: 100                     # Latent dimensions for SVD factorization
    knn_k: 20                      # Neighbors for collaborative filtering
    gene_teacher_n_folds: 5        # CV folds for gene baseline teacher

  # Cross-validation
  validation:
    n_folds: 5
    protocols: ["gene", "cell"]    # "gene" = group-by-gene, "cell" = group-by-cell

  # Output
  output_dir: "outputs/prediction"

  # ── Formula-based model configuration ────────────────────────────────────
  formula:
    # Gene essentiality formula: μ̂_g = Ridge(gene_features)
    gene_alpha: 1.0                  # Ridge regularization (auto-tuned via CV)

    # Cell vulnerability formula: β̂_c = Ridge(cell_features)
    cell_alpha: 10.0                 # Ridge regularization (stronger prior)

    # Cold-start: pathway-similarity KNN transfer
    cold_knn: 20                     # Number of warm neighbors for cold genes

    # ── Per-cell isotonic calibration ──────────────────────────────────
    calibration:
      enabled: true                    # Per-cell isotonic regression calibration
      y_min: -5.0                      # Clip lower bound
      y_max: 5.0                       # Clip upper bound
      min_samples: 200                 # Min warm genes per cell to fit cell-specific curve
                                       # (higher → more cells use global calibration, less overfit)

    # ── Per-cell quantile alignment for cold genes ───────────────────
    quantile_align:
      enabled: false                   # Align cold gene quantiles to match warm distribution
      min_warm: 20                     # Min warm genes per cell
      min_cold: 5                      # Min cold genes per cell

    # ── Hybrid SVD + Gene-Similarity CF Interaction ──────────────────────
    hybrid_interaction:
      n_components: 30                 # SVD components for warm genes
      cf_knn: 30                       # K nearest warm neighbors for cold gene CF
      cf_weight: 0.7                   # CF blend weight (0=formula only, 1=CF only)
      cf_multi_kernel: true            # Use multi-kernel gene similarity (COSINE-style)
      cf_power: 2.0                    # Similarity power (p>1 amplifies high-sim neighbors)

    # ── Multi-Output Gene Profile Predictor ────────────────────────────
    profile:
      enabled: false                    # Multi-output Ridge: gene features → full profile
      n_components: 50                  # PCA components for output compression
      blend_weight: 0.3                 # Blend weight (cold genes only)

    # ── Structured Biological Interaction (legacy) ───────────────────────
    structured_interaction:
      alpha: 1.0
      include_lineage: true

    # ── Inductive Matrix Completion (IMC) ────────────────────────────────
    imc:
      enabled: false
      rank: 12
      lambda_w: 0.1
      lambda_h: 0.1
      max_iter: 30

  # ── Legacy white-box config (preserved for reference; not used by formula models)
  whitebox:
    svd_weight: 0.5
    cf_weight: 0.6
    factor_analysis: {n_components: 80, max_iter: 3000}
    elasticnet: {l1_ratio: 0.9, n_alphas: 50, max_iter: 5000}
    pca_ridge: {n_components: 100, ridge_alpha: 10.0}
    pls: {n_components: 40}
    spline_gam: {max_features: 20, smooth: 0.2}
    als: {n_factors: 20, regularization: 1.0, max_iter: 30}
    blend_alphas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
